[package]
name = "lrqc"
version = "0.9.1"
edition = "2021"
rust-version = "1.91"
description = "Per-barcode QC reports for Oxford Nanopore and PacBio long reads"
license = "MIT"
repository = "https://github.com/DylanCosto/lrQC"
readme = "README.md"
keywords = ["bioinformatics", "nanopore", "pacbio", "quality-control", "long-reads"]
categories = ["command-line-utilities", "science"]
exclude = ["tests/*", "bench/*", ".github/*"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
memchr = "2"
rayon = "1.11"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Pure-Rust DEFLATE for BGZF blocks.
zflate = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
